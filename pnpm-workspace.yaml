allowBuilds:
  '@dhis2/cli-helpers-engine': true
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  cypress: true
  esbuild: true
  opensrc: true
  unrs-resolver: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@dhis2/*'
  - '@dhis2-ui/*'
# These hoists are needed for @dhis2/app-shell since it uses directly some libraries that were hoisted by yarn 1
# This is a better alternative than pnpm's shamefullyHoist https://pnpm.io/settings#shamefullyhoist until we update the way that @dhis2/app-shell works
publicHoistPattern:
  - '@dhis2/ui'
  - 'typeface-roboto'
  - '@dhis2/app-adapter'
  - 'prop-types'
  - '@dhis2/d2-i18n'
  - 'post-robot'
  - 'styled-jsx'
  - '@dhis2/pwa'
# i18next-scanner (used by `d2-app-scripts i18n extract`) depends on `i18next: *` and needs a version that still
# supports `compatibilityJSON: 'v3'` (removed in v24). Without this, any i18n.t() call with `count` is left out of en.pot.
overrides:
  'i18next-scanner>i18next': '^23'
