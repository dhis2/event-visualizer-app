name: 'deploy to IM idv-playground instance'

on:
    schedule:
        - cron: '0 5 * * *' # Runs every day at 5:00 AM UTC
    push:
        branches:
            - master
        tags:
            - '*'
    workflow_dispatch: # Allows manual triggering of the workflow

env:
    GH_TOKEN: ${{secrets.DHIS2_BOT_GITHUB_TOKEN}}
    CI: true

jobs:
    deploy-to-im-idv-playground-instance:
        if: |
            ${{ !github.event.push.repository.fork }} &&
            ${{ github.ref == 'refs/heads/master' ||  startsWith(github.ref, 'refs/tags/') }}

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm d2-app-scripts build

            - name: Deploy build to IM idv-playground instance
              run: pnpm d2-app-scripts deploy https://dev.im.dhis2.org/idv-playground --username=admin --password=district
